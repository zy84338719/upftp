# Goreleaser 配置:push tag 时由 GitHub Actions 触发,
# 自动构建 6 平台二进制并发布到 GitHub Releases。
#
# 注:Homebrew tap / Scoop bucket 的自动推送暂未启用,
#     待 tap/bucket 仓库的 secret 配置完整后(参见 packaging/)再启用 brews/scoops。
#     当前发布只产出二进制归档 + checksums,足以支持 install.sh 安装。
# 文档:https://goreleaser.com

version: 2

project_name: upftp

before:
  hooks:
    - go mod tidy

builds:
  - id: upftp
    main: ./
    binary: upftp
    env:
      - CGO_ENABLED=0
    ldflags:
      # 把版本/提交/构建时间注入 main.version 等变量
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{ .Version }}_
      {{ .Os }}_{{ .Arch }}
    files:
      - LICENSE.txt
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: zy84338719
    name: upftp
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }} · {{ .ProjectName }}"
  header: |
    ## upftp {{ .Tag }}
    快速、即开即用的 FTP 文件分享工具。单二进制,跨平台。

    ### 一行安装
    **Linux / macOS:**
    ```bash
    curl -fsSL https://github.com/zy84338719/upftp/raw/main/scripts/install.sh | bash
    ```
    **Windows(PowerShell):**
    ```powershell
    irm https://github.com/zy84338719/upftp/raw/main/scripts/install.ps1 | iex
    ```

    ### 手动下载
    下方选择对应平台的归档,解压后将 `upftp`(Windows 为 `upftp.exe`)放入 PATH。
